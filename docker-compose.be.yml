services:
  mariadb:
    image: mariadb:11
    networks:
      backend-network:
    restart: on-failure:5
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-rootpassword}
      MARIADB_DATABASE: ${DB_NAME:-pethaven}
      MARIADB_USER: ${DB_USER:?DB_USER not set}
      MARIADB_PASSWORD: ${DB_PASS:?DB_PASS not set}
    volumes:
      - db-data:/var/lib/mysql
      - ./backend/db-init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    networks:
      backend-network:
    restart: on-failure:5
    depends_on:
      mariadb:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-pethaven}
      DB_USER: ${DB_USER:?DB_USER not set}
      DB_PASS: ${DB_PASS:?DB_PASS not set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET not set}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    volumes:
      - uploads:/usr/app/data/user-images

volumes:
  db-data:
  uploads:

networks:
  backend-network:
