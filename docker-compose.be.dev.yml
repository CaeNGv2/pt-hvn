services:
  backend:
    ports:
      - "3662:3000"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      DB_HOST: ${DB_HOST:-mariadb}
      DB_PORT: ${DB_PORT:-3306}
      DB_NAME: ${DB_NAME:-pethaven}
      DB_USER: ${DB_USER:-pethaven}
      DB_PASS: ${DB_PASS:-pethaven}
      JWT_SECRET: ${JWT_SECRET:-pethaven-dev-secret-change-in-prod}
  
  phpmyadmin:
    ports:
      - 3663:80
