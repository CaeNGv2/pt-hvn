services:
  backend:
    networks:
      traefik_net:
    environment:
      NODE_ENV: ${NODE_ENV:-production}
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.backend.entrypoints=https"
      - "traefik.http.routers.backend.rule=Host(`${BACKEND_API_DOMAIN:?BACKEND_API_DOMAIN not set}`)"
      - "traefik.http.routers.backend.tls=true"
      - "traefik.http.routers.backend.service=backend"
      - "traefik.http.services.backend.loadbalancer.server.port=3000"
  
  phpmyadmin:
    networks:
      traefik_net:
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.phpmyadmin.entrypoints=https"
      - "traefik.http.routers.phpmyadmin.rule=Host(`${PHPMYADMIN_DOMAIN:?PHPMYADMIN_DOMAIN not set}`)"
      - "traefik.http.routers.phpmyadmin.tls=true"
      - "traefik.http.routers.phpmyadmin.service=phpmyadmin"
      - "traefik.http.services.phpmyadmin.loadbalancer.server.port=80"

networks:
  traefik_net:
    name: traefik_net
    external: true
